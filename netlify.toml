# Netlify builds the website: the static site in site/, built by Vite into dist/site.
[build]
  command = "npm run build:site"
  publish = "dist/site"

[build.environment]
  NODE_VERSION = "20"

# The thank-you page after the lead form is not for search results.
[[headers]]
  for = "/thanks/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Security headers on every page. The site loads only its own files: one script bundle, one stylesheet,
# fonts and images, plus the one-line inline script in index.html that marks JavaScript as on (allowed by
# its hash below; if that line changes, recompute the hash or the page falls back to its no-JS layout).
# Inline style attributes are allowed (the HTML sets CSS variables in them) but inline <style> blocks are
# not. Everything not listed is blocked. The lead form posts to this same site (Netlify Forms), so
# form-action and connect-src stay 'self'.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo='; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; worker-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Everything Vite puts in /assets has a content hash in its name, so a changed file gets a new name.
# Browsers may keep these for a year without asking again.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
